<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>IBAN Prüfung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      color: #333;
    }

    input {
      padding: 0.6em;
      width: 100%;
      margin-top: 10px;
      font-size: 1em;
    }

    button {
      padding: 0.6em 1.2em;
      margin-top: 15px;
      font-size: 1em;
      cursor: pointer;
    }

    .result {
      margin-top: 1.5em;
      font-weight: bold;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h2>IBAN-Prüfung</h2>
  <label for="iban">IBAN eingeben:</label>
  <input type="text" id="iban" placeholder="z. B. DE89370400440532013000" />
  <button onclick="checkIBAN()">IBAN prüfen</button>
  <div class="result" id="result"></div>

  <script>
    // IBAN-Validierung (Modulo 97)
    function isValidIBAN(iban) {
      iban = iban.toUpperCase().replace(/\s+/g, '');
      if (!iban.match(/^[A-Z0-9]+$/)) return false;
      iban = iban.slice(4) + iban.slice(0, 4);
      iban = iban.replace(/[A-Z]/g, ch => ch.charCodeAt(0) - 55);
      let remainder = iban;
      while (remainder.length > 2) {
        let block = remainder.slice(0, 9);
        remainder = (parseInt(block, 10) % 97).toString() + remainder.slice(block.length);
      }
      return parseInt(remainder, 10) % 97 === 1;
    }

    // IBAN prüfen und Ergebnis anzeigen
    function checkIBAN() {
      const iban = document.getElementById('iban').value;
      const resultDiv = document.getElementById('result');
      const valid = isValidIBAN(iban);
      resultDiv.textContent = valid ? "✅ Gültige IBAN" : "❌ Ungültige IBAN";
      resultDiv.style.color = valid ? "green" : "red";
    }

    // Wenn IBAN aus URL kommt, automatisch prüfen
    const urlParams = new URLSearchParams(window.location.search);
    const ibanFromForm = urlParams.get('iban');
    if (ibanFromForm) {
      document.getElementById('iban').value = ibanFromForm;
      checkIBAN();
    }
  </script>
</body>
</html>
